name: ipydrawio-docs

channels:
  - conda-forge
  - nodefaults

dependencies:
  ### ipydrawio-docs-deps ###

  - docutils >=0.18.1
  - jupyter-server-mathjax
  - myst-nb
  - pkginfo
  - pydata-sphinx-theme >=0.10.1,<0.11.0
  - pytest-check-links
  - sphinx >=5,<6
  - sphinx-jsonschema
  - sphinxext-rediraffe
  - pip:
      - jupyterlite ==0.1.0b12

  ### ipydrawio-docs-deps ###

  #############################################################################
  # the below are imported from ../.github/environment.yml
  ### ipydrawio-dev-deps ###

  # core
  - doit
  - nodejs >=12,!=13.*,<15
  - python # this gets patched in ci
  # run
  - ipywidgets >=7.6,<9
  - jupyterlab >=3.4.5,<4.0.0a0
  - jupyterlab_widgets >=1
  - lxml
  - pillow
  - pypdf2
  - requests_cache
  - retrolab
  # building
  - flit >=3.7.1
  - pip
  - twine >=3.7.1
  - wheel
  # linting
  - black
  - flake8
  - isort >=5
  - pyflakes
  - pyyaml
  - robotframework-lint
  - robotframework-tidy
  # unit testing
  - pytest
  - pytest-console-scripts
  - pytest-cov
  - pytest-html
  - pytest-tornasync
  - pytest-xdist
  # acceptance testing
  - firefox =102
  - geckodriver >=0.28.0
  - robotframework >=4
  - robotframework-pabot
  - robotframework-seleniumlibrary
  # reporting
  - codecov

  ### ipydrawio-dev-deps ###
