name: ipydrawio-dev

channels:
  - conda-forge
  - nodefaults

dependencies:
  ### ipydrawio-dev-deps ###

  # core
  - doit
  - nodejs >=16,<17
  - python # this gets patched in ci
  # run
  - ipywidgets >=7.6,<9
  - jupyterlab >=3.5.0,<4.0.0a0
  - jupyterlab_widgets >=1
  - lxml
  - pillow
  - pypdf2
  - requests_cache
  - retrolab
  # building
  - flit >=3.7.1
  - pip
  - twine >=3.7.1
  - wheel
  # linting
  - black
  - flake8
  - isort >=5
  - pyflakes
  - pyyaml
  - robotframework-lint
  - robotframework-tidy
  - ssort
  # unit testing
  - pytest
  - pytest-console-scripts
  - pytest-cov
  - pytest-html
  - pytest-tornasync
  - pytest-xdist
  # acceptance testing
  - firefox =102
  - geckodriver >=0.28.0
  - robotframework >=6
  - robotframework-pabot
  - robotframework-seleniumlibrary
  # reporting
  - codecov

  ### ipydrawio-dev-deps ###
