name: ipydrawio-demo

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python >=3.8
  # demo toys
  - graphviz2drawio
  - jupyter-lsp-python-lsp-server
  - jupyterlab-deck
  - jupyterlab-link-share
  - jupyterlab-lsp
  - matplotlib-base
  - nbgitpuller
  - networkx
  - pandas <2
  - pygraphviz
  - python-graphviz
  - qrcode-artistic
  - rich
  - segno
  - shapely
  - sphinx-autobuild
  - tabulate
  ### FEDERATED EXTENSIONS ###
  - bqplot
  - jupyterlab_widgets
  - jupyterlab-tour
  - jupyterlab-webrtc-docprovider
  - wxyz_datagrid
  - wxyz_json_schema_form
  - wxyz_lab
  - wxyz_svg
  ### FEDERATED EXTENSIONS ###
  ############################################################################
  ### ipydrawio-docs-deps ###

  - autodoc-traits
  - docutils >=0.18.1
  - jupyter-server-mathjax
  - jupyterlite-core ==0.1.0
  - jupyterlite-core-with-libarchive
  - jupyterlite-pyodide-kernel ==0.0.6
  - myst-nb
  - pkginfo
  - pydata-sphinx-theme >=0.13.3,<0.14.0
  - pytest-check-links
  - python-libarchive-c
  - sphinx >=5,<6
  - sphinx-copybutton
  - sphinx-design
  - sphinx-jsonschema
  - sphinxext-rediraffe

  ### ipydrawio-docs-deps ###

  ############################################################################

  ############################################################################
  ### ipydrawio-dev-deps ###

  # core
  - doit
  - nodejs >=18,<19
  - python # this gets patched in ci
  # run
  - ipywidgets >=7.6,<9
  - jupyterlab >=3.6.3,<4.0.0a0
  - jupyterlab_widgets >=1
  - lxml
  - pillow
  - pypdf >=3.5
  - requests_cache
  # building
  - flit >=3.7.1
  - pip
  - twine >=3.7.1
  - wheel
  # linting
  - black
  - nbqa
  - pyyaml
  - robotframework-lint
  - robotframework-tidy
  - ruff
  - ssort
  # unit testing
  - pytest
  - pytest-console-scripts
  - pytest-html
  - pytest-jupyter-server
  - pytest-tornasync
  - pytest-xdist
  # acceptance testing
  - firefox =102
  - geckodriver >=0.28.0
  - robotframework >=6
  - robotframework-pabot
  - robotframework-seleniumlibrary
  # reporting
  - codecov

  ### ipydrawio-dev-deps ###

  ############################################################################
